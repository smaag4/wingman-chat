<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Wingman</title>
  <meta name="description" content="AI-powered chat assistant" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- Manifest -->
  <!-- <link rel="manifest" href="manifest.json" /> -->
  
  <!-- Favicons: fallback first, then theme-aware overrides -->
  <link rel="icon" type="image/svg+xml" href="icon_light.svg" />
  <link rel="icon" type="image/png" href="icon_light.png" />
  <link rel="icon" type="image/svg+xml" href="icon_light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="icon_light.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="icon_dark.svg" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="icon_dark.png" media="(prefers-color-scheme: dark)" />
  
  <!-- Theme colors -->
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  
  <!-- PWA / Mobile -->
  <link rel="apple-touch-icon" sizes="512x512" href="icon_app.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- Prevent theme flashing by setting dark class and data-theme immediately -->
  <script>
    (function() {
      var stored = localStorage.getItem('app_theme');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var darkThemes = { dark: 1, void: 1, carbon: 1 };
      var themedVariants = { frost: 1, dawn: 1, void: 1, carbon: 1 };

      // Determine if dark mode
      var shouldBeDark = stored in darkThemes || (!(stored === 'light' || stored === 'frost' || stored === 'dawn') && systemDark);

      if (shouldBeDark) {
        document.documentElement.classList.add('dark');
      }
      if (stored in themedVariants) {
        document.documentElement.setAttribute('data-theme', stored);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
